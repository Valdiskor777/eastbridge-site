        <!-- Порядок на ≤768px (WeChat → телефон → почта → QR) задаётся CSS-свойством order, разметка не дублируется -->

          <figure class="qr">
            <img src="assets/wechat-qr.png" width="220" height="220" alt="" data-i18n-attr="alt:contacts.qrAlt">
            <figcaption data-i18n="contacts.qrCaption"></figcaption>
            <p class="qr__note" data-i18n="contacts.qrNote"></p>
          </figure>
          <dl class="contact-list">
            <div class="contact-row" data-ph>
              <dt data-i18n="contacts.wechatLabel"></dt>
              <dd class="contact-val">
                <!-- Значение — ссылка-приглашение WeChat, видимым текстом и целиком, вместе с «?s=4»:
                     при отказе обоих способов копирования кнопка выделяет именно этот узел, и человеку
                     достаётся полный адрес. Текст ставит applyLang из data-config, href — initContactLinks
                     (адрес приглашения он собирает для любого вида, кроме tel и mailto, а текст сокращает
                     только при data-contact-link="wechat" — здесь сокращать нечего). По этой же строке
                     hidePlaceholders() гасит контакт, пока в config заглушка. -->
                <a class="contact-link contact-val__text contact-val__text--mono contact-val__text--url" id="wechat-value" data-contact-link="invite" data-config="wechat" target="_blank" rel="noopener"></a>
                <!-- Копирование: navigator.clipboard, запасной путь execCommand (сайт показывают с file://) -->
                <button type="button" class="copy-btn" data-copy="wechat-value">
                  <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><rect x="9" y="9" width="11" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 15V5a2 2 0 0 1 2-2h8" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
                  <span class="copy-btn__label" data-copy-label data-i18n="contacts.copy"></span>
                </button>
                <p class="contact-note" data-i18n="contacts.wechatNote"></p>
              </dd>
            </div>
            <div class="contact-row" data-ph>

              <!-- href подставляет initContactLinks() из config; без валидного значения ссылка не создаётся и строка остаётся текстом -->
              <dd class="contact-val"><a class="contact-link" data-contact-link="tel"><span data-config="phone"></span></a></dd>
            </div>
            <div class="contact-row" data-ph>
              <dt data-i18n="contacts.emailLabel"></dt>
              <dd class="contact-val"><a class="contact-link" data-contact-link="mailto"><span data-config="email"></span></a></dd>
            </div>
          </dl>
